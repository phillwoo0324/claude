name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FoldAnim.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest FoldAnim.apk --target "$GITHUB_SHA" \
            --title "FoldAnim (latest build)" \
            --notes "Galaxy Z Fold hinge-driven fold animation demo. Download FoldAnim.apk and install."
