plugins {
    id 'com.android.application'
}

android {
    namespace 'com.foldanim.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.foldanim.demo'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // 데모용 고정 서명 키 (업데이트 설치가 되도록 매번 같은 키로 서명)
    signingConfigs {
        demo {
            storeFile file('demo.keystore')
            storePassword 'android'
            keyAlias 'demo'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
